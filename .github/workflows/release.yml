name: Release

on:
  push:
    branches:
      - main
    paths:
      - app/build.gradle.kts
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build, e.g. v1.0.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
            if [ -z "$VERSION" ]; then
              echo "::error::versionName not found"
              exit 1
            fi
            TAG="v$VERSION"
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
              echo "Tag $TAG already exists, nothing to release"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git tag "$TAG"
            git push origin "$TAG"
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - if: steps.tag.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - if: steps.tag.outputs.skip != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - if: steps.tag.outputs.skip != 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        if: steps.tag.outputs.skip != 'true'
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease

      - name: Sign APK
        if: steps.tag.outputs.skip != 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'etg' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing KEYSTORE_BASE64 secret"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          UNSIGNED=$(ls app/build/outputs/apk/release/*.apk | head -1)
          OUT="ETG-${TAG}.apk"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass env:KEY_PASSWORD \
            --out "$OUT" \
            "$UNSIGNED"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --print-certs "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"
          rm -f "$RUNNER_TEMP/release.jks"
          echo "APK=$OUT" >> "$GITHUB_ENV"

      - name: Publish release
        if: steps.tag.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Export To Graphene ${{ env.TAG }}
          generate_release_notes: true
          files: |
            ${{ env.APK }}
            ${{ env.APK }}.sha256
